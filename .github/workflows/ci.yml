name: Verify and package

on: [push, pull_request]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Native verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Verify native CLI
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Scan Go dependencies
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  package:
    name: Package binaries
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dct-packages
          path: dist/dct-*/*
          if-no-files-found: error
          retention-days: 7
